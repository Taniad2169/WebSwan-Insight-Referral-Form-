<script>
  (function () {
    const wrapper = document.getElementById("webswan-insight-wrapper");
    const host = document.getElementById("webswan-insight-host");
    const template = document.getElementById("webswan-insight-template");

    if (!wrapper || !host || !template || host.shadowRoot) {
      return;
    }

    const root = host.attachShadow({ mode: "open" });
    root.appendChild(template.content.cloneNode(true));

    const externalFormAnchor = document.getElementById("form");
    const internalFormSection = root.getElementById("form-content");
    const container = root.querySelector(".container");

    function positionExternalFormAnchor() {
      if (!externalFormAnchor || !internalFormSection) {
        return;
      }

      const wrapperTop = wrapper.getBoundingClientRect().top;
      const formTop = internalFormSection.getBoundingClientRect().top;

      externalFormAnchor.style.top =
        Math.max(0, formTop - wrapperTop) + "px";
    }

    container.classList.add("loading");

    function removeLoadingState() {
      container.classList.remove("loading");
      window.requestAnimationFrame(positionExternalFormAnchor);
    }

    if (document.readyState === "loading") {
      window.addEventListener("load", removeLoadingState);
    } else {
      window.setTimeout(removeLoadingState, 800);
    }

    const images = root.querySelectorAll("img");

    if (images.length > 0) {
      let loadedCount = 0;

      images.forEach(function (img) {
        if (img.complete) {
          loadedCount++;
        } else {
          img.addEventListener("load", function () {
            loadedCount++;

            if (loadedCount === images.length) {
              removeLoadingState();
            }
          });

          img.addEventListener("error", function () {
            loadedCount++;

            if (loadedCount === images.length) {
              removeLoadingState();
            }
          });
        }
      });

      if (loadedCount === images.length) {
        window.setTimeout(removeLoadingState, 300);
      }
    }

    const pageUrl = encodeURIComponent(
      "https://taniad2169.github.io/WebSWan-Alignable/"
    );

    const pageTitle = encodeURIComponent(
      "The WebSwan Insight – check this out!"
    );

    const copyButton = root.getElementById("copyLinkBtn");
    const copyFeedback = root.getElementById("copyFeedback");

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";

      root.appendChild(textarea);
      textarea.select();

      try {
        document.execCommand("copy");
        copyFeedback.textContent = "✅ Link copied!";
      } catch (error) {
        copyFeedback.textContent =
          "❌ Could not copy. Please select and copy the link manually.";
      }

      window.setTimeout(function () {
        copyFeedback.textContent = "";
      }, 3000);

      root.removeChild(textarea);
    }

    copyButton.addEventListener("click", function () {
      const url = decodeURIComponent(pageUrl);

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(url)
          .then(function () {
            copyFeedback.textContent = "✅ Link copied to clipboard!";

            window.setTimeout(function () {
              copyFeedback.textContent = "";
            }, 3000);
          })
          .catch(function () {
            fallbackCopy(url);
          });
      } else {
        fallbackCopy(url);
      }
    });

    const whatsappButton = root.getElementById("shareWhatsApp");

    whatsappButton.href =
      "https://api.whatsapp.com/send?text=" +
      pageTitle +
      "%20" +
      pageUrl;

    const smsModal = root.getElementById("smsModal");
    const smsButton = root.getElementById("shareSmsBtn");
    const smsInput = root.getElementById("smsPhoneInput");
    const sendSmsButton = root.getElementById("modalSendSms");
    const cancelSmsButton = root.getElementById("modalCancelSms");

    function openSmsModal() {
      smsModal.classList.add("active");
      smsInput.value = "";
      smsInput.focus();
    }

    function closeSmsModal() {
      smsModal.classList.remove("active");
    }

    smsButton.addEventListener("click", openSmsModal);
    cancelSmsButton.addEventListener("click", closeSmsModal);

    smsModal.addEventListener("click", function (event) {
      if (event.target === smsModal) {
        closeSmsModal();
      }
    });

    sendSmsButton.addEventListener("click", function () {
      const phone = smsInput.value.trim();

      if (!phone) {
        alert("Please enter a phone number.");
        return;
      }

      const rawPhone = phone.replace(/[\s\-()]/g, "");

      if (!/^\+?\d{7,15}$/.test(rawPhone)) {
        alert("Please enter a valid phone number.");
        return;
      }

      const smsUrl =
        "sms:" +
        encodeURIComponent(rawPhone) +
        "?body=" +
        pageTitle +
        "%20" +
        pageUrl;

      window.open(smsUrl, "_blank");
      closeSmsModal();
    });

    smsInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        sendSmsButton.click();
      }
    });

    const referralOverlay = root.getElementById("referralOverlay");
    const openReferralButton = root.getElementById("openReferralBtn");
    const closeReferralButton = root.getElementById("closeReferralBtn");
    const referralForm = root.getElementById("referralForm");
    const referralSubmitButton = root.getElementById("referralSubmitBtn");
    const referralComment = root.getElementById("refLeadComment");
    const referralWordCount = root.getElementById("wordCountRef");

    function openReferralPanel() {
      referralOverlay.classList.add("active");
    }

    function closeReferralPanel() {
      referralOverlay.classList.remove("active");
    }

    openReferralButton.addEventListener("click", openReferralPanel);
    closeReferralButton.addEventListener("click", closeReferralPanel);

    referralOverlay.addEventListener("click", function (event) {
      if (event.target === referralOverlay) {
        closeReferralPanel();
      }
    });

    referralComment.addEventListener("input", function () {
      const text = referralComment.value.trim();
      const words = text === "" ? 0 : text.split(/\s+/).length;

      referralWordCount.textContent = words;
      referralWordCount.style.color =
        words > 300 ? "#e74c3c" : "#888";
    });

    referralForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const text = referralComment.value.trim();
      const words = text === "" ? 0 : text.split(/\s+/).length;

      if (words > 300) {
        alert("Comment exceeds 300 words. Please shorten your message.");
        return;
      }

      referralSubmitButton.disabled = true;
      referralSubmitButton.textContent = "⏳ Sending...";

      try {
        const response = await fetch(referralForm.action, {
          method: "POST",
          body: new FormData(referralForm),
          headers: {
            Accept: "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("Submission failed");
        }

        referralForm.innerHTML = [
          '<div class="referral-success">',
          "<h2>✅ Thank You!</h2>",
          "<p>Your referral was sent successfully.</p>",
          '<p style="margin-top:20px;color:#666">🦢 — The WebSwan Team</p>',
          "</div>"
        ].join("");

        window.setTimeout(closeReferralPanel, 4000);
      } catch (error) {
        alert(
          "Something went wrong. Please try again or email designs@thewebswan.com."
        );

        referralSubmitButton.disabled = false;
        referralSubmitButton.textContent = "📤 Submit Referral";
      }
    });

    const consultationForm = root.querySelector(
      'form[action="https://formspree.io/f/xeajwvbo"]'
    );

    if (consultationForm) {
      const submitButton = consultationForm.querySelector(
        'button[type="submit"]'
      );

      const originalButtonText = submitButton.textContent;

      consultationForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        submitButton.disabled = true;
        submitButton.textContent = "⏳ Sending...";

        try {
          const response = await fetch(consultationForm.action, {
            method: "POST",
            body: new FormData(consultationForm),
            headers: {
              Accept: "application/json"
            }
          });

          if (!response.ok) {
            throw new Error("Form submission failed");
          }

          consultationForm.innerHTML = [
            '<div style="text-align:center;padding:30px 20px">',
            '<h2 style="color:#0f9d58;font-size:1.8rem">✅ Thank You!</h2>',
            '<p style="font-size:1.1rem;margin-top:15px;color:#333">',
            "Your message was sent successfully.<br>",
            "We’ll get back to you within 24 hours.",
            "</p>",
            '<p style="margin-top:20px;color:#666">🦢 — The WebSwan Team</p>',
            "</div>"
          ].join("");

          window.requestAnimationFrame(positionExternalFormAnchor);
        } catch (error) {
          alert(
            "Something went wrong. Please try again or email designs@thewebswan.com."
          );

          submitButton.disabled = false;
          submitButton.textContent = originalButtonText;
        }
      });
    }

    const consultationButton = root.querySelector('a[href="#form"]');

    if (consultationButton) {
      consultationButton.addEventListener("click", function (event) {
        event.preventDefault();

        if (internalFormSection) {
          internalFormSection.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }
      });
    }

    window.addEventListener("load", positionExternalFormAnchor);
    window.addEventListener("resize", positionExternalFormAnchor);

    if ("ResizeObserver" in window) {
      new ResizeObserver(positionExternalFormAnchor).observe(container);
    }

    window.requestAnimationFrame(positionExternalFormAnchor);

    const backToTopButton = root.getElementById("backToTopBtn");
    const shell = root.querySelector(".ws-shell");

    function updateBackToTopVisibility() {
      const appTop = host.getBoundingClientRect().top;
      const internalScroll = shell ? shell.scrollTop : 0;

      backToTopButton.classList.toggle(
        "visible",
        appTop < -300 || internalScroll > 300
      );
    }

    backToTopButton.addEventListener("click", function () {
      if (shell) {
        shell.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }

      host.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    window.addEventListener("scroll", updateBackToTopVisibility, {
      passive: true
    });

    if (shell) {
      shell.addEventListener("scroll", updateBackToTopVisibility, {
        passive: true
      });
    }

    updateBackToTopVisibility();
  })();
</script>
